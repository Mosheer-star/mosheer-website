backend:
  name: github
  repo: Mosheer-star/mosheer-website
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "assets"
public_folder: "/assets"

collections:
  - name: "articles"
    label: "المقالات"
    folder: "articles"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "الوصف", name: "description", widget: "text", required: false }
      - { label: "المحتوى", name: "body", widget: "markdown" }
